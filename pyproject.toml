[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoindex"
version = "0.1.0"
description = "A modern Python package for Earth Observation preprocessing, spectral indices, and time-series analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

authors = [
    {name = "Ratan Chandra Bhowmick"}
]

keywords = [
    "remote sensing",
    "gis",
    "earth observation",
    "satellite",
    "spectral indices",
    "vegetation index",
    "python"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "matplotlib>=3.9"
]

[project.urls]
Homepage = "https://github.com/Ratan1995/geoindex"
Repository = "https://github.com/Ratan1995/geoindex"
Issues = "https://github.com/Ratan1995/geoindex/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["geoindex*"]